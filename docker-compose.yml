# Self-contained stack for local Docker or a Coolify "Docker Compose" deployment.
# Its own Postgres — completely independent of the Vercel/Render test deployment.
# In Coolify, set the env vars (JWT_SECRET, MASTER_ENCRYPTION_KEY, POSTGRES_PASSWORD) in the
# UI; the defaults below are only for quick local testing.

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lotus_crm}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lotus_crm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-lotus_crm}?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:-3bd3716f3f8f26f3ccc3a99e5b9cf65275f1f6c0ccddb8914b224b0f39da7206}
      PORT: "4000"
      NODE_ENV: production
      # nginx serves the browser same-origin, so this only needs the frontend's own origin.
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    depends_on:
      db:
        condition: service_healthy
    # Exposed to the frontend container over the internal network; also mapped for direct testing.
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    restart: always
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  db_data:
